<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Notification Panel with Support</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .box { background: #fff; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin-left: auto; margin-right: auto; }
        input, textarea, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        textarea { resize: vertical; height: 80px; }
        button { background: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #218838; }
        h3 { margin-top: 0; color: #333; }

        /* --- कोने में सपोर्ट बटन का स्टाइल (Corner Support Button) --- */
        .support-float-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0088cc;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: bold;
            z-index: 1000;
            transition: 0.3s;
        }
        .support-float-btn:hover { background: #006699; }

        /* --- सपोर्ट पॉप-अप मॉडल (Popup Modal) --- */
        .support-modal {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1001;
            padding: 15px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Admin Panel & Notification System</h2>

    <!-- 1. New ID / Registration Section -->
    <div class="box">
        <h3>नई आईडी बनाएं (Registration)</h3>
        <input type="text" id="regUserId" placeholder="यूजर आईडी या मोबाइल नंबर">
        <input type="text" id="regUserName" placeholder="यूजर का नाम">
        <button onclick="handleRegistration()">आईडी बनाएं</button>
    </div>

    <!-- 2. Recharge Section -->
    <div class="box">
        <h3>रिचार्ज / डिपॉजिट (Recharge)</h3>
        <input type="text" id="recUserId" placeholder="यूजर आईडी">
        <input type="number" id="recAmount" placeholder="रिचार्ज राशि (₹)">
        <input type="text" id="recUtr" placeholder="UTR / Transaction ID">
        <button onclick="handleRecharge()">रिचार्ज कन्फर्म करें</button>
    </div>

    <!-- 3. Withdrawal Section -->
    <div class="box">
        <h3>विथड्रॉल रिक्वेस्ट (Withdrawal)</h3>
        <input type="text" id="withUserId" placeholder="यूजर आईडी">
        <input type="number" id="withAmount" placeholder="विथड्रॉल राशि (₹)">
        <button onclick="handleWithdrawal()">विथड्रॉल भेजें</button>
    </div>


    <!-- --- कोने का सपोर्ट / शिकायत बटन (Floating Support Button) --- -->
    <div class="support-float-btn" onclick="toggleSupportModal()">💬 Support / Complaint</div>

    <!-- --- सपोर्ट फॉर्म पॉप-अप --- -->
    <div class="support-modal" id="supportModal">
        <h3>शिकायत या मदद दर्ज करें</h3>
        <input type="text" id="compUserId" placeholder="अपनी यूजर आईडी या मोबाइल नंबर">
        <textarea id="compMessage" placeholder="अपनी समस्या या शिकायत यहाँ लिखें..."></textarea>
        <button onclick="handleComplaint()" style="background: #dc3545;">शिकायत भेजें</button>
        <button onclick="toggleSupportModal()" style="background: #6c757d; margin-top: 5px;">बंद करें</button>
    </div>


    <!-- Telegram Integration Script -->
    <script>
        // Telegram Bot Function
        function sendTelegramAlert(eventType, userId, details) {
            const token = '7060236112:AAFSZSgRdoegdb4e_8FJ9s4h0BtGkgEwE1s';
            const chatId = '6318395817';
            
            const message = `🚨 नया अलर्ट: *${eventType}* \n\n👤 आईडी/यूजर: \`${userId}\`\n💬 विवरण: \`${details}\``;
            
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=` + encodeURIComponent(message) + `&parse_mode=Markdown`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if(data.ok) {
                        alert('सफलतापूर्वक Telegram पर भेज दिया गया!');
                    } else {
                        alert('टेलीग्राम भेजने में असफल।');
                    }
                })
                .catch(error => console.log('Error:', error));
        }

        // पॉप-अप खोलने/बंद करने का फंक्शन
        function toggleSupportModal() {
            let modal = document.getElementById('supportModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        // Registration
        function handleRegistration() {
            let id = document.getElementById('regUserId').value;
            let name = document.getElementById('regUserName').value;
            if(!id || !name) { alert('सभी फील्ड भरें!'); return; }
            sendTelegramAlert("नई आईडी बनी", id, "नाम: " + name);
        }

        // Recharge
        function handleRecharge() {
            let id = document.getElementById('recUserId').value;
            let amount = document.getElementById('recAmount').value;
            let utr = document.getElementById('recUtr').value;
            if(!id || !amount || !utr) { alert('सभी फील्ड भरें!'); return; }
            sendTelegramAlert("रिचार्ज / डिपॉजिट", id, "राशि: ₹" + amount + " | UTR: " + utr);
        }

        // Withdrawal
        function handleWithdrawal() {
            let id = document.getElementById('withUserId'].value;
            let amount = document.getElementById('withAmount').value;
            if(!id || !amount) { alert('सभी फील्ड भरें!'); return; }
            sendTelegramAlert("विथड्रॉल रिक्वेस्ट", id, "राशि: ₹" + amount);
        }

        // Complaint / Support
        function handleComplaint() {
            let id = document.getElementById('compUserId').value;
            let msg = document.getElementById('compMessage').value;
            if(!id || !msg) { alert('कृपया आईडी और संदेश दोनों लिखें!'); return; }
            
            sendTelegramAlert("नई शिकायत / सपोर्ट (Complaint)", id, "शिकायत: " + msg);
            toggleSupportModal();
            document.getElementById('compUserId').value = '';
            document.getElementById('compMessage').value = '';
        }
    </script>

</body>
</html>
