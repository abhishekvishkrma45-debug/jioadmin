<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Wealth World - Login / Register</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #f0f6fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .card h2 {
      text-align: center;
      color: #f1c40f;
      margin-bottom: 24px;
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #8b949e;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #f1c40f;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #f1c40f;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #d4ac0d;
    }

    .toggle-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #8b949e;
    }

    .toggle-text span {
      color: #f1c40f;
      cursor: pointer;
      text-decoration: underline;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Register Form -->
    <div id="registerForm">
      <h2>Health Wealth World</h2>
      <form id="regForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Apna Naam Enter Karein" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number / User ID</label>
          <input type="text" id="phone" placeholder="Phone Number ya User ID" required>
        </div>
        <div class="form-group">
          <label for="pin">Password / PIN</label>
          <input type="password" id="pin" placeholder="Password daalein" required>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <div class="toggle-text">
        Pehle se Account hai? <span id="toLogin">Login Karein</span>
      </div>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="hidden">
      <h2>Health Wealth World</h2>
      <form id="logForm">
        <div class="form-group">
          <label for="loginPhone">Phone Number / User ID</label>
          <input type="text" id="loginPhone" placeholder="Enter Registered Phone/ID" required>
        </div>
        <div class="form-group">
          <label for="loginPin">Password / PIN</label>
          <input type="password" id="loginPin" placeholder="Enter Password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <div class="toggle-text">
        Naya Account Banayein? <span id="toReg">Register Karein</span>
      </div>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const loginForm = document.getElementById('loginForm');
    const toLoginBtn = document.getElementById('toLogin');
    const toRegBtn = document.getElementById('toReg');

    // Switch between Register and Login
    toLoginBtn.addEventListener('click', function() {
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    toRegBtn.addEventListener('click', function() {
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
    });

    // Form Submit Handlers
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Registration Successful! Ab Login Karein.');
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    document.getElementById('logForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Login Successful!');
    });
  </script>

</body>
</html>
